<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>歌词叠层演示（Star Wars Crawl）</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;}
  body{background:#05070b;}
  .wrap{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;}
  .stage{position:relative;width:min(88vw,980px);height:78vh;margin-bottom:4vh;overflow:hidden;
         -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 22%,#000 78%,transparent 100%);
                 mask-image:linear-gradient(to bottom,transparent 0%,#000 22%,#000 78%,transparent 100%);}
  .crawl{position:absolute;left:0;right:0;bottom:0;height:100%;perspective:760px;perspective-origin:50% 100%;}
  .lines{position:absolute;left:0;right:0;bottom:0;height:100%;transform-style:preserve-3d;}
  .line{position:absolute;left:0;right:0;bottom:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
        color:#eaf2ff;text-shadow:0 0 10px rgba(120,180,255,.22),0 2px 8px rgba(0,0,0,.65);}
  .line.current{color:#fff;font-weight:700;text-shadow:0 0 18px rgba(120,180,255,.45),0 2px 10px rgba(0,0,0,.75);}
  .hud{position:fixed;left:18px;bottom:18px;padding:10px 12px;border-radius:12px;background:rgba(12,16,24,.72);
       color:#dce6f5;font-size:13px;backdrop-filter:blur(6px);}
  .hud b{color:#fff}
  .hint{position:fixed;right:18px;bottom:18px;color:#8fa0b8;font-size:12px;text-align:right;line-height:1.7}
  .bar{position:fixed;left:18px;right:18px;bottom:82px;height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;}
  .fill{height:100%;width:0;background:linear-gradient(90deg,#4da3ff,#ff7a45);}
  .btn{margin-left:8px;padding:4px 10px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(255,255,255,.06);color:#eaf2ff;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <div class="crawl"><div class="lines" id="lines"></div></div>
  </div>
</div>

<div class="bar"><div class="fill" id="fill"></div></div>
<div class="hud">
  <div><b id="song">Lemon</b> — <span id="artist">米津玄師</span></div>
  <div style="margin-top:4px;color:#9fb0c6">点歌人：演示观众 · 当前歌词效果预览</div>
  <div style="margin-top:8px"><button class="btn" onclick="toggle()">暂停/继续</button><button class="btn" onclick="resetDemo()">重播</button></div>
</div>
<div class="hint">
  方案：独立 OBS 浏览器源 /lyrics<br>
  当前行保持清晰，后段向灭点收拢变暗；进度随播放推进
</div>

<script>
var lyrics = [
  {t:0,   text:'夢ならばどれほどよかったでしょう'},
  {t:4,   text:'いまだにあなたのことを夢にみる'},
  {t:9,   text:'忘れた物を取りに帰るように'},
  {t:13,  text:'古びた思い出の埃を払う'},
  {t:18,  text:'戻らない幸せがあることを'},
  {t:23,  text:'最後にあなたが教えてくれた'},
  {t:27,  text:'言えずに隠してた昏い過去も'},
  {t:32,  text:'あなたがいなきゃ永遠に昏いまま'},
  {t:37,  text:'きっともうこれ以上 傷つくことなど'},
  {t:42,  text:'ありはしないとわかっている'},
  {t:47,  text:'あの日の悲しみさえ あの日の苦しみさえ'},
  {t:52,  text:'そのすべてを愛してた あなたとともに'},
  {t:58,  text:'胸に残り離れない 苦いレモンの匂い'},
  {t:64,  text:'雨が降り止むまでは帰れない'}
];
var idx = 0, timer = null, start = performance.now(), paused = false, baseElapsed = 0;

function fmt(t){var m=Math.floor(t/60),s=Math.floor(t%60);return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
function build(){
  var box=document.getElementById('lines');
  box.innerHTML='';
  lyrics.forEach(function(l,i){
    var d=document.createElement('div');
    d.className='line';
    d.id='line-'+i;
    d.textContent=l.text;
    box.appendChild(d);
  });
}
function layout(elapsed){
  var i;
  var current = 0;
  for(i=0;i<lyrics.length;i++){ if(lyrics[i].t <= elapsed) current = i; }
  idx = current;
  for(i=0;i<lyrics.length;i++){
    var el=document.getElementById('line-'+i);
    var rel=i-current;
    var z = rel;
    var opacity, scale, y;
    if(rel < 0){
      y = 0;
      scale = 1;
      opacity = Math.max(0, 1 + rel*0.16);
      z = rel * 2.2;
    } else {
      y = rel * 46;
      scale = Math.max(0.34, 1 - rel*0.075);
      opacity = Math.max(0, 1 - rel*0.11);
      z = rel * 54;
    }
    el.style.transform = 'translateY(' + (-y) + 'px) translateZ(' + (-z) + 'px) rotateX(52deg) scale(' + scale + ')';
    el.style.opacity = opacity;
    el.style.fontSize = (rel===0 ? 30 : 24) + 'px';
    el.className = 'line' + (rel===0 ? ' current' : '');
  }
  document.getElementById('fill').style.width = Math.min(100, elapsed/64*100) + '%';
}
function tick(){
  if(!paused){
    var elapsed = baseElapsed + (performance.now()-start)/1000;
    layout(elapsed);
  }
  requestAnimationFrame(tick);
}
function toggle(){
  paused = !paused;
  if(paused){ baseElapsed += (performance.now()-start)/1000; } else { start = performance.now(); }
}
function resetDemo(){
  baseElapsed = 0; start = performance.now(); paused = false; layout(0);
}
build(); layout(0); tick();
setInterval(function(){}, 1000);
</script>
</body>
</html>
